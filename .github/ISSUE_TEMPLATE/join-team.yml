name: 团队加入申请
description: 提交成员接入回执，供仓库所有者处理协作者邀请。
title: "[加入申请] 请填写执行者代号"
body:
  - type: markdown
    attributes:
      value: |
        请使用你本人的 GitHub 账号提交申请，仓库所有者会以本 Issue 的作者账号为邀请对象。
        这是团队申请记录，不会自动授予写权限。所有者发送协作者邀请后，你仍需接受邀请。
        不要填写密码、访问令牌或其他凭据。
  - type: dropdown
    id: agent_id
    attributes:
      label: 执行者代号
      description: 选择团队已经分配给你的代号。
      options:
        - A
        - B
        - C
    validations:
      required: true
  - type: dropdown
    id: clone_status
    attributes:
      label: 仓库读取状态
      options:
        - 已成功克隆或读取仓库
        - 尚未成功，需要协助
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 接入说明
      description: 可填写遇到的问题；无问题可填写“申请协作者写入权限”。
    validations:
      required: false
  - type: checkboxes
    id: request_access
    attributes:
      label: 申请确认
      options:
        - label: 我申请成为此仓库的协作者，接受邀请后按团队约定使用自己的工作分支。
          required: true
